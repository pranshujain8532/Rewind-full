[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rewind"
version = "0.1.0"
description = "Local accountability infrastructure for AI agents"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "uvicorn==0.54.0",
  "mcp==2.3.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[tool.hatch.build.targets.wheel]
packages = ["packages/rewind_core", "packages/rewind_sandbox", "services/api/rewind_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".tools", ".venv", "node_modules", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
